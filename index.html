<style>
  @font-face{font-family:'Press Start 2P';src:url('assets/fonts/PressStart2P.ttf') format('truetype');font-display:block;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#181425;
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;

  body{position:fixed;inset:0;}
  canvas{display:block;position:absolute;left:0;top:0;touch-action:none;
    image-rendering:pixelated;image-rendering:crisp-edges;-ms-interpolation-mode:nearest-neighbor;}
  #rot{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#181425;color:#fff;font-family:'Press Start 2P',monospace;text-align:center;padding:16px;}
  #rot .ph{width:28px;height:48px;border:4px solid #c0cbdc;border-radius:6px;animation:rt 2s steps(2) infinite;}
  #rot .t{font-size:16px;line-height:24px;} #rot .s{font-size:8px;line-height:14px;color:#8b9bb4;}
  @keyframes rt{0%{transform:rotate(-90deg)}50%{transform:rotate(0deg)}100%{transform:rotate(-90deg)}}
  #safe{position:absolute;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}

<script>
(function(){
'use strict';
// =====================================================================
// GAME CONFIG - every player-facing name, label, description and color.
// Rename anything here; no other code hardcodes these strings.
// Tower ids fast/area/slow/support and enemy ids runner/brute/boss are
// internal role keys only and are never shown to the player.
// =====================================================================
const CONFIG = {
  title: 'Wyrmwake TD',
  tagline: 'merge  ·  boost  ·  defend the Clutch',
  unit: 'dragon', units: 'dragons',
  base: { name: 'The Clutch', label: 'THE CLUTCH', hp: 'Warmth' },   // home base; its HP is warmth
  levels: ['', 'Hatchling', 'Fledgling', 'Juvenile', 'Drake', 'Elder'], // confirmed by PM
  towers: {

               desc:'Many maws breathe a slow bloom of fire' },
    slow:    { name:'Kanju',   short:'Kanju',   color:'#6fd6c8', role:'Tide-mist slow',

  },
  // Boost cards. {fast} {area} {slow} {support} = tower short names; {unit}/{units}; {base} = base name; {hp} = base HP word.
  boosts: {
    fastDmg:    { name:'Lance Wind',       desc:'+{v}% {fast} damage',               color:'#0099db' },
    areaRad:    { name:'Third Maw',        desc:'{area} blast radius +{v}%',         color:'#e43b44' },
    slowLen:    { name:'Held Tide',        desc:'{slow} slow lasts {v}% longer',     color:'#6fd6c8' },
    atkSpd:     { name:'Wind under Wings', desc:'+{v}% attack speed (all {units})',  color:'#63c74d' },
    coinKill:   { name:'Hoard Tithe',      desc:'+{v} coin per kill',                 color:'#feae34' },
    heal:       { name:'Warm the Clutch',  desc:'{base} regains {v} {hp}',            color:'#f6757a' },
    summonDisc: { name:'Thin Shells',      desc:'Summons cost {v}% less',            color:'#c0cbdc' },
    crit:       { name:'Heartfang',        desc:'+{v}% crit chance (2x damage)',     color:'#f77622' }
  },
  // ---- Balance: every gameplay tunable lives here (no labels) ----
  balance: {
    totalWaves: 20, bossEvery: 5, firstWaveDelay: 3, waveInterval: 7,
    startCoins: 100, warmthMax: 20,
    summonBase: 10, summonStep: 3,            // summon cost = base + step * summonsSoFar
    boostBase: 50, boostStep: 35,             // boost cost  = base + step * boostsSoFar
    maxLevel: 5, dmgPerLevel: 2.4, rangePerLevel: 8,
    // If the board already holds >= supportSoftCap support dragons, a summon/merge that rolls support rerolls.
    supportSoftCap: 3,
    // A merge whose RESULT is this level or higher can only roll support if both inputs were support.
    supportMergeMinLevel: 4,
    enemyHpGrowth: 1.155,                     // enemy HP x growth^(wave-1)
    runnerSpeedPerWave: 0.012,
    bossSlowResist: 0.5,                      // bosses take this fraction of slow
    finalBoss: { hpVsWave15Boss: 2.5, speedMult: 1.3, radius: 21 },
    // Reaching the Clutch with the final boss = immediate loss. Wins require killing it.
    finalBossLeakLoses: true,
    firstSummonAttacker: true,                // the first summon of a match never rolls the support type
    waveBonusBase: 4,                         // coins at each wave start (from wave 2): base + wave
    waves: { baseCount: 5, brutesPerWave: 0.45, bossEscortsBase: 3, bossEscortsPer5: 2,
             spawnGap: 0.42, bruteGap: 0.7, bossGap: 1.2 },
    towers: {
      fast:    { dmg:8,  cd:0.5, range:135, proj:520, pr:3 },
      area:    { dmg:20, cd:1.5, range:120, proj:280, pr:5, splash:40, splashPerLevel:0.08 },
      slow:    { dmg:4,  cd:0.9, range:120, proj:380, pr:4, slow:0.35, slowPerLevel:0.06, slowMax:0.7,
                 slowDur:1.6, slowDurPerLevel:0.12 },
      support: { aura:0.15 }                  // +15% attack speed per level to the 8 adjacent slots
    },
    enemies: {
      runner: { hp:16,  spd:64, r:8,  dmg:1, coin:3,  coinPerWaves:4 },  // +1 coin every N waves
      brute:  { hp:62,  spd:30, r:12, dmg:2, coin:6,  coinPerWaves:3 },
      boss:   { hp:420, spd:23, r:17, dmg:8, coin:40, coinPer5Waves:10 }
    },
    boosts: { fastDmg:0.20, areaRad:0.25, slowLen:0.50, atkSpd:0.10, coinKill:1, heal:6, summonDisc:0.15, crit:0.10 }
  },
  // Rotate overlay only on phone-like devices: (pointer: coarse) and (hover: none), physical screen short side < this, landscape window.
  display: { rotateOverlayMaxScreenShortSide: 500 },
  // Art: manifest location and the art ids used in sheet keys (dragon.<id>.lv<N>.<anim>, enemy.<id>.<anim>).
  art: { manifest: 'assets/manifest.json',
         towers: { fast:'jaculus', area:'zmei', slow:'kanju', support:'ehecatl' },
         enemies: { runner:'poacher', brute:'brute', boss:'boss' }, finalBoss: 'boss_final',   // manifest "enemy" field
         clutchStates: { full: 0.67, mid: 0.34 },    // warmth fraction above which the full / mid nest is shown, else low
         // Game slot -> Designer sheet ids, first one present wins (batch 2 names are guesses; any listed alias works).
         // Sheets the loader does not preload (app icons are <link> tags; *_native screens are 1x sources of the 2x art).
         noPreload: { categories: ['app_icon'], idPattern: '_native$' },
         // Our boost id -> manifest "enhancement" of the enhance_card sheet
         cards: { fastDmg:'lance_wind', areaRad:'third_maw', slowLen:'held_tide', atkSpd:'wind_under_wings',
                  coinKill:'hoard_tithe', heal:'warm_the_clutch', summonDisc:'thin_shells', crit:'heartfang' },
         // Game slot -> Designer sheet ids; the first id present in the manifest wins.
         slots: {
           'fx.jaculus.bolt': ['jaculus_javelin','jaculus_projectile'],
           'fx.zmei.bolt':    ['zmei_fireball','zmei_projectile'],
           'fx.kanju.bolt':   ['kanju_tidemist','kanju_projectile'],
           'fx.jaculus.hit':  ['jaculus_hit'],
           'fx.zmei.impact':  ['zmei_explosion','zmei_impact'],
           'fx.kanju.pool':   ['kanju_mist_pool'],
           'fx.aura':         ['ehecatl_aura'],
           'fx.aura_gold':    ['ehecatl_aura_gold','ehecatl_aura'],
           'fx.merge':        ['merge_sparkle'],
           'fx.levelup':      ['levelup_flash'],
           'fx.coin':         ['coin_pickup'],
           'hud.summon':  ['btn_summon'],  'hud.enhance': ['btn_enhance'],
           'hud.pause':   ['btn_pause'],   'hud.resume':  ['btn_resume'],  'hud.restart': ['btn_restart'],
           'hud.btn9':    ['btn_panel_9slice'], 'hud.panel': ['panel_9slice'],
           'hud.bar':     ['bar_frame_9slice'], 'hud.bar_fill': ['bar_fill_warmth'],
           'hud.coin':    ['icon_coin'], 'hud.heart': ['icon_heart'], 'hud.warmth': ['icon_warmth'],
           'hud.wave':    ['wave_badge'],
           'ui.card_select': ['enh_card_select'],
           'ui.win':      ['screen_win'],  'ui.lose':     ['screen_lose'],
         } },
  text: {
    summon:'SUMMON', boardFull:'BOARD FULL', mergeHint:'merge {units}', boost:'ENHANCE', coins:'coins', loading:'LOADING...',
    howTo:'Drag two identical {units} together to merge', play:'PLAY', chooseBoost:'Choose a boost',
    paused:'Paused', resume:'RESUME', restart:'RESTART', playAgain:'PLAY AGAIN', victory:'VICTORY!', defeat:'THE CLUTCH WENT COLD',
    wave:'Wave', nextIn:'Next in', bossIn:'Boss in', finalWave:'Final wave!', incoming:'{n} incoming',
    bossWave:'{boss} · WAVE', finalBoss:'FINAL {boss}', waveBonus:'wave', crit:'CRIT',
    allCleared:'All {n} waves cleared', reached:'Cleared {c} of {n} waves', bossLeak:'The final {boss} reached the Clutch',
    rotate:'Rotate your phone', rotateSub:'{title} plays in portrait', time:'Time', kills:'Kills',
    bestWave:'Best wave', bestCleared:'Best: wave {w} cleared', wins:'Wins', newBest:'(new!)'
  }
};
// Fixed save key: deliberately NOT derived from the title, so renaming keeps saves.
const SAVE_KEY = 'mergetd-dragon-proto.save.v1';
function fmt(str, extra){ return str.replace(/\{(\w+)\}/g, (m,k)=> extra && extra[k]!=null ? extra[k] : CONFIG.towers[k] ? CONFIG.towers[k].short :
  k==='title' ? CONFIG.title : k==='base' ? CONFIG.base.name : k==='hp' ? CONFIG.base.hp : k==='boss' ? CONFIG.enemies.boss.name : (typeof CONFIG[k]==='string' ? CONFIG[k] : m)); }
const T = (k, extra) => fmt(CONFIG.text[k], extra);
const TW = id => CONFIG.towers[id];
document.title = CONFIG.title + ' (prototype)';

// ---------- URL flags (debug only, off by default) ----------
const Q = new URLSearchParams(location.search);
const SPEED = Math.max(0.1, Math.min(50, parseFloat(Q.get('speed')) || 1));
const SEED = Q.get('seed') ? (parseInt(Q.get('seed'),10)>>>0) : ((Date.now() ^ (Math.random()*1e9))>>>0);
const SHOW_FPS = Q.has('fps');

// ---------- RNG ----------
let rs = SEED || 1;
const SEED_FIXED = Q.has('seed');
function reseed(){ rs = SEED_FIXED ? (SEED || 1) : (((Date.now() ^ (Math.random()*1e9))>>>0) || 1); }
function rnd(){ rs |= 0; rs = rs + 0x6D2B79F5 | 0; let t = Math.imul(rs ^ rs >>> 15, 1 | rs);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const pick = a => a[(rnd()*a.length)|0];

// ---------- Config ----------
const B = CONFIG.balance;
const LW = 360, COLS = 5, ROWS = 3, CELL = 56, MAX_LVL = B.maxLevel, TOTAL_WAVES = B.totalWaves;
const WAVE_INTERVAL = B.waveInterval, FIRST_WAVE_DELAY = B.firstWaveDelay;
const CASTLE_MAX = B.warmthMax, START_COINS = B.startCoins;
const SUMMON_BASE = B.summonBase, SUMMON_STEP = B.summonStep;
const ENH_BASE = B.boostBase, ENH_STEP = B.boostStep;
const LOADOUT = ['fast','area','slow','support'];
// gameplay numbers only (names/colors live in CONFIG.towers)
const STATS = B.towers;
const LVL_COLOR = ['#fff','#ffffff','#7dff8a','#57b8ff','#d27dff','#ffd23f'];
const dmgMult = L => Math.pow(B.dmgPerLevel, L-1);
const ENEMY = B.enemies;
const hpScale = w => Math.pow(B.enemyHpGrowth, w-1);
const finalBossHp = () => ENEMY.boss.hp * hpScale(15) * B.finalBoss.hpVsWave15Boss;
const boostVal = id => { const v = B.boosts[id]; return (id==='coinKill'||id==='heal') ? v : Math.round(v*100); };
const ENHANCEMENTS = Object.keys(CONFIG.boosts).map(id => ({id, ...CONFIG.boosts[id]}));
const cardDesc = e => fmt(e.desc, {v: boostVal(e.id)});

// ---------- Save ----------
function loadSave(){ try{ const s = JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');
  return {bestWave: s.bestWave|0, wins: s.wins|0}; }catch(e){ return {bestWave:0,wins:0}; } }
function writeSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
let save = loadSave();

// ---------- Pixel canvas / layout ----------
// The game renders into a fixed 360x640 native canvas, letterboxed in the safe area.
// Fit scale s = min(availW/360, availH/640) in CSS px. Use the whole-number scale floor(s)
// when it still covers at least 80% of that fit; otherwise use the fractional fit so small
// screens fill. Sampling stays nearest-neighbour either way. The displayed CSS size is snapped
// so that CSS px * devicePixelRatio is a whole number of device pixels.
const NW = 360, NH = 640;
const cv = document.getElementById('c'), ctx = cv.getContext('2d', {alpha:false});
cv.width = NW; cv.height = NH;
const safeEl = document.getElementById('safe'), rotEl = document.getElementById('rot');
let vw=0, vh=0, dpr=1, pixK=1, scaleMode='integer', LH=NH;
const L = {}; // layout (logical px)
let path = [], pathLen = 0, segs = [];
// Blink stores used lengths in 1/64 CSS px (truncating). Pick a quantum near `css` whose
// product with devicePixelRatio is a whole device pixel, so the canvas is not sampled
// on a fractional device-pixel phase.
function snapLayoutPx(css, ratio){
  if(!(ratio>0)) return Math.max(0, css);
  const idealDev = Math.max(0, css) * ratio;
  const n0 = Math.round(Math.max(0, css) * 64);
  let best = Math.max(0, n0) / 64, bestScore = Infinity, bestDist = Infinity;
  for(let dn=-512; dn<=512; dn++){
    const n = n0 + dn; if(n < 0) continue;
    const q = n / 64, dev = q * ratio, devRound = Math.round(dev);
    if(Math.abs(dev - devRound) > 1e-4) continue;
    const score = Math.abs(devRound - idealDev), dist = Math.abs(q - css);
    if(score < bestScore - 1e-6 || (Math.abs(score - bestScore) <= 1e-6 && dist < bestDist)){
      bestScore = score; bestDist = dist; best = q;
    }
  }
  return best;
}
function resize(){
  vw = window.innerWidth; vh = window.innerHeight; dpr = window.devicePixelRatio || 1;
  const cs = getComputedStyle(safeEl);
  const st = parseFloat(cs.paddingTop)||0, sr = parseFloat(cs.paddingRight)||0,
        sb = parseFloat(cs.paddingBottom)||0, sl = parseFloat(cs.paddingLeft)||0;
  const aw = Math.max(50, vw - sl - sr), ah = Math.max(50, vh - st - sb);
  const s = Math.min(aw/NW, ah/NH);                         // fit scale in CSS px
  const whole = Math.floor(s);
  const maxDevW = Math.max(1, Math.floor(aw*dpr + 1e-4));
  const maxDevH = Math.max(1, Math.floor(ah*dpr + 1e-4));
  let devW, devH;
  if(whole >= 1 && whole / s >= 0.80){
    devW = Math.round(NW * whole * dpr); devH = Math.round(NH * whole * dpr);
    scaleMode = (devW >= 1 && devH >= 1 && devW <= maxDevW && devH <= maxDevH) ? 'integer' : 'fractional';
  } else scaleMode = 'fractional';
  if(scaleMode === 'fractional'){
    // Fill the limiting axis; derive the other so the art stays 360:640, then snap both to device pixels.
    if(aw/NW <= ah/NH){
      devW = maxDevW; devH = Math.round(devW * NH / NW);
      if(devH > maxDevH){ devH = maxDevH; devW = Math.max(1, Math.min(maxDevW, Math.round(devH * NW / NH))); }
    } else {
      devH = maxDevH; devW = Math.round(devH * NW / NH);
      if(devW > maxDevW){ devW = maxDevW; devH = Math.max(1, Math.min(maxDevH, Math.round(devW * NH / NW))); }
    }
    devW = Math.max(1, devW); devH = Math.max(1, devH);
  }
  const cw = snapLayoutPx(devW / dpr, dpr), ch = snapLayoutPx(devH / dpr, dpr);
  pixK = cw * dpr / NW;                                     // device px per art px (fractional when the fit is)
  cv.style.width = cw+'px'; cv.style.height = ch+'px';
  const left = snapLayoutPx(sl + Math.max(0, (aw - cw) / 2), dpr);
  const top = snapLayoutPx(st + Math.max(0, (ah - ch) / 2), dpr);
  cv.style.left = left+'px'; cv.style.top = top+'px';
  ctx.imageSmoothingEnabled = false;
}
function layout(){
  // Matches the Designer's mockup (wyrmwake_mockup_1080x1920.png, 360x640 native).
  L.hudH = 56; L.ctrlY = 556;
  L.topY = 162; L.boardX = 40; L.boardY = 188; L.tile = 48;
  L.botY = L.boardY + CELL*ROWS + 22; L.castleY = L.botY + 64;
  L.laneL = 20; L.laneR = 340; L.laneW = 28;
  // Path start x=-16 keeps total path length at 1086 px, identical to the pre-art build (balance unchanged).
  path = [[-16,L.topY],[L.laneR,L.topY],[L.laneR,L.botY],[L.laneL,L.botY],[L.laneL,L.castleY],[150,L.castleY]];
  segs = []; pathLen = 0;
  for(let i=0;i<path.length-1;i++){ const a=path[i], b=path[i+1]; const len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    segs.push({a,b,len,start:pathLen,dx:Math.sign(b[0]-a[0])}); pathLen += len; }
  L.nestX = 176; L.nestY = L.castleY;
  const y0 = L.ctrlY + 26;                          // 96x32 Designer buttons, centred in the 84px control bar
  L.btnCoins = {x:12, y:y0, w:104, h:32};
  L.btnSummonDraw = {x:128, y:y0, w:96, h:32};  L.btnSummon = {x:124, y:y0-12, w:104, h:56};   // hit areas padded
  L.btnEnhDraw    = {x:244, y:y0, w:96, h:32};  L.btnEnh    = {x:236, y:y0-12, w:116, h:56};
  L.btnPauseDraw = {x:320, y:12, w:32, h:32};
  L.btnPause = {x:312, y:4, w:48, h:48};          // larger hit area than the drawn button
}
function posAt(d, out){
  if(d<=0){ out.x = path[0][0] + d; out.y = path[0][1]; out.dx = 1; return out; }
  for(const s of segs){ if(d <= s.start + s.len){ const t=(d-s.start)/s.len;
    out.x = s.a[0]+(s.b[0]-s.a[0])*t; out.y = s.a[1]+(s.b[1]-s.a[1])*t; if(s.dx) out.dx = s.dx; return out; } }
  const e = path[path.length-1]; out.x=e[0]; out.y=e[1]; return out;
}
const cellCenter = i => ({x: L.boardX + (i%COLS)*CELL + CELL/2, y: L.boardY + ((i/COLS)|0)*CELL + CELL/2});
function cellAt(x,y){ const c = Math.floor((x-L.boardX)/CELL), r = Math.floor((y-L.boardY)/CELL);
  if(c<0||c>=COLS||r<0||r>=ROWS) return -1; return r*COLS+c; }
const inR = (p,b) => b && p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h;

// ---------- Game state ----------
let G;
function newGame(mode){
  reseed(); // L4: with ?seed=N every new match/restart replays the same RNG stream
  G = { mode: mode||'play', time:0, wave:0, waveTimer:FIRST_WAVE_DELAY, queue:[], spawnT:0,
    enemies:[], dragons:new Array(COLS*ROWS).fill(null), projs:[], fx:[], sfx:[], texts:[],
    coins:START_COINS, castle:CASTLE_MAX, summons:0, enhBought:0, kills:0,
    buffs:{fastDmg:0,areaRad:0,slowLen:0,atkSpd:0,coinKill:0,summonDisc:0,crit:0},
    hudWave:0, bossLeaks:[], waveLeft:new Array(TOTAL_WAVES+2).fill(0), cleared:0, finalBossKilled:false, lossReason:null, sel:null, cards:null, result:null, banner:null, shake:0, newBest:false };
  drag = null;
}
const summonCost = () => Math.round((SUMMON_BASE + SUMMON_STEP*G.summons) * Math.pow(1 - B.boosts.summonDisc, G.buffs.summonDisc));
const enhCost = () => ENH_BASE + ENH_STEP*G.enhBought;
const freeCells = () => { const f=[]; G.dragons.forEach((h,i)=>{ if(!h) f.push(i); }); return f; };
// resultLvl/inputType are given for merges only. Support is rerolled to one of the other three types when
// (a) the board already holds >= supportSoftCap support dragons, or (b) a merge result is >= supportMergeMinLevel
// and the two inputs were not support.
function rollType(resultLvl, inputType){
  const t = pick(LOADOUT);
  if(t !== 'support') return t;
  const n = G.dragons.reduce((k,h)=> k + (h && h.type==='support' ? 1 : 0), 0);
  const blockedByCap = n >= B.supportSoftCap;
  const blockedByLevel = resultLvl >= B.supportMergeMinLevel && inputType !== 'support';
  return (blockedByCap || blockedByLevel) ? pick(LOADOUT.filter(x=>x!=='support')) : t;
}
const mkDragon = (type,lvl) => ({type, lvl, cd: rnd()*0.3, pop:1, aim:0, atkStart:-9, phase: Math.random()*4}); // phase: visual only, not game RNG

function summon(){
  if(G.mode!=='play') return false;
  const cost = summonCost(), free = freeCells();
  if(G.coins < cost || !free.length) return false;
  const first = G.summons === 0;
  G.coins -= cost; G.summons++;
  const i = pick(free);
  const type = (first && B.firstSummonAttacker) ? pick(LOADOUT.filter(x=>x!=='support')) : rollType(1, null);
  G.dragons[i] = mkDragon(type, 1);
  const c = cellCenter(i); ring(c.x,c.y,'#fff',30);
  return true;
}
function canMerge(a,b){ return a && b && a.type===b.type && a.lvl===b.lvl && a.lvl<MAX_LVL; }
function dropDragon(from, to){
  if(from===to || to<0) return 'none';
  const a = G.dragons[from], b = G.dragons[to];
  if(!a) return 'none';
  if(canMerge(a,b)){
    G.dragons[from] = null; G.dragons[to] = null; // count the board without the merging pair
    G.dragons[to] = mkDragon(rollType(a.lvl+1, a.type), a.lvl+1);
    const c = cellCenter(to), nd = G.dragons[to];
    nd.prev = {type:a.type, lvl:a.lvl}; nd.mergeT = G.time;   // visual: old sprite until merge_sparkle frame 3
    if(!sfx('fx.merge', c.x, c.y)){ ring(c.x,c.y,LVL_COLOR[a.lvl+1],44); ring(c.x,c.y,'#fff',28); }
    floatText(c.x, c.y-24, CONFIG.levels[a.lvl+1]+' '+TW(G.dragons[to].type).name, LVL_COLOR[a.lvl+1]);

}
function openEnhance(){
  if(G.mode!=='play') return false;
  const cost = enhCost(); if(G.coins < cost) return false;
  G.coins -= cost; G.enhBought++;
  const pool = ENHANCEMENTS.filter(e => !(e.id==='heal' && G.castle >= CASTLE_MAX)); const cards=[]; // L2
  for(let k=0;k<3;k++){ cards.push(pool.splice((rnd()*pool.length)|0,1)[0]); }
  G.cards = cards; G.mode = 'enhance'; drag = null;
  return true;
}
function chooseCard(k){
  if(G.mode!=='enhance' || !G.cards[k]) return;
  const e = G.cards[k];
  if(e.id==='heal'){ G.castle = Math.min(CASTLE_MAX, G.castle+B.boosts.heal); }
  else G.buffs[e.id]++;
  G.banner = {text:e.name+'!', sub:cardDesc(e), t:1.6, c:e.color};
  G.cards = null; G.mode = 'play';
}

function startWave(w){
  G.wave = w; G.waveTimer = WAVE_INTERVAL;
  if(w>1){ const bonus = B.waveBonusBase + w; G.coins += bonus; floatText(L.btnCoins.x+46, L.btnCoins.y-8, '+'+bonus+' '+T('waveBonus'), '#ffd23f'); }
  const boss = w%B.bossEvery===0, W = B.waves;
  const q = [];
  const n = boss ? W.bossEscortsBase + (w/B.bossEvery|0)*W.bossEscortsPer5 : W.baseCount + w;
  const brutes = boss ? (w/B.bossEvery|0) : Math.floor(w*W.brutesPerWave);
  for(let k=0;k<n;k++) q.push(k < n-brutes ? 'runner' : 'brute');
  for(let k=q.length-1;k>0;k--){ const j=(rnd()*(k+1))|0; [q[k],q[j]]=[q[j],q[k]]; }
  if(boss) q.push('boss');

}
// L1: best wave = highest wave whose enemies are all resolved (killed, or leaked while the Clutch survived)
function checkCleared(){
  while(G.cleared < G.wave && G.waveLeft[G.cleared+1] === 0){ G.cleared++;
    if(G.cleared > save.bestWave){ save.bestWave = G.cleared; G.newBest = true; writeSave(); } }
}
function spawnEnemy(kind, waveNo){
  const d = ENEMY[kind], w = waveNo || G.wave;
  const fin = kind==='boss' && w===TOTAL_WAVES;
  const hp = fin ? finalBossHp() : d.hp * hpScale(w);
  G.enemies.push({kind, hp, max:hp, spd:d.spd*(1+ (kind==='runner'? w*B.runnerSpeedPerWave:0)) * (fin ? B.finalBoss.speedMult : 1), r: fin ? B.finalBoss.radius : d.r,
    dist: -10 - rnd()*8, slowT:0, slowF:0, x:0, y:0, dx:1, phase: Math.random(), dead:false, hitT:0,
    wave: w, final: kind==='boss' && w===TOTAL_WAVES});
  // N3: the HUD wave / banners follow the wave whose enemies are actually spawning
  if(w > G.hudWave){ G.hudWave = w;
    const boss = w % B.bossEvery === 0;
    G.banner = w===TOTAL_WAVES ? {text:T('finalWave').toUpperCase(), sub:'', t:2, c:P.PU3}
             : boss ? {text:(T('bossWave')+' '+w).toUpperCase(), sub:'', t:2, c:P.PU3}
             : {text:(T('wave')+' '+w).toUpperCase(), sub:'', t:1.1, c:P.WH}; }
  if(fin) G.banner = {text:T('finalBoss').toUpperCase(), sub:'', t:2, c:P.RD};
}
function endGame(win){
  if(G.mode==='over') return;
  G.mode = 'over'; drag = null;
  if(win){ G.cleared = TOTAL_WAVES; if(TOTAL_WAVES > save.bestWave){ save.bestWave = TOTAL_WAVES; G.newBest = true; } save.wins++; }
  writeSave();
  G.result = {win, wave: G.wave, cleared: G.cleared, time: G.time, reason: G.lossReason};
}

// ---------- FX ----------
function ring(x,y,c,r){ G.fx.push({t:0, d:0.45, x,y,c,r, k:'ring'}); }
function boom(x,y,c,r){ G.fx.push({t:0, d:0.3, x,y,c,r, k:'boom'}); }
// Sprite effects from the manifest. t0 is sim time, so they freeze with the game. Visual only.
function sfx(slot, x, y, o){ const sh = sheet(slot); if(!sh) return false;
  const dur = (o && o.dur) || (sh.fps ? sh.frames/sh.fps : 0.3);
  G.sfx.push({sh, x, y, t0:G.time, dur, scale:(o && o.scale) || 1, under: !!(o && o.under), loop: !!(o && o.dur)});
  if(G.sfx.length > 80) G.sfx.shift(); return true; }
function floatText(x,y,s,c){ G.texts.push({x,y,s,c,t:0,d:0.9}); if(G.texts.length>40) G.texts.shift(); }

// ---------- Simulation ----------
const tmp = {x:0,y:0};
function supportBonus(i){
  const c = i%COLS, r = (i/COLS)|0; let b = 0;
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
    if(!dr&&!dc) continue; const cc=c+dc, rr=r+dr;
    if(cc<0||cc>=COLS||rr<0||rr>=ROWS) continue;
    const h = G.dragons[rr*COLS+cc]; if(h && h.type==='support') b += STATS.support.aura*h.lvl;
  } return b;
}
function damage(e, amt, crit){
  if(e.dead) return;
  e.hp -= amt; e.hitT = 0.08;
  if(e.hp <= 0){ e.dead = true; G.kills++; G.waveLeft[e.wave]--; if(e.final) G.finalBossKilled = true;
    const D = ENEMY[e.kind];
    const base = D.coin + (e.kind==='boss' ? D.coinPer5Waves*(G.wave/5|0) : (G.wave/D.coinPerWaves|0));
    const gain = base + G.buffs.coinKill; G.coins += gain;
    floatText(e.x, e.y-10, '+'+gain, '#ffd23f'); sfx('fx.coin', e.x, e.y + 8);
    boom(e.x,e.y,CONFIG.enemies[e.kind].color, e.r+8);
  } else if(crit) floatText(e.x, e.y-12, T('crit'), '#ff9f43');
}
// Attack animation sync (visual only; never touches cd, targeting or RNG): the strip starts hit_frame/fps before the
// shot is due, so the projectile (spawned at the unchanged fire time) leaves on hit_frame. If no pre-roll ran
// (first shot / target just arrived), the strip starts at hit_frame.
function atkLead(as){ return as && as.fps ? (as.hit != null ? as.hit : 1) / as.fps : 0; }
function attackPreroll(h, i, tLeft){
  const as = dragonSheet(h.type, h.lvl, 'attack'); if(!as) return;
  const lead = atkLead(as); if(tLeft > lead || G.time - h.atkStart < as.frames/as.fps) return;
  const c = cellCenter(i), range = STATS[h.type].range + B.rangePerLevel*(h.lvl-1), r2 = range*range;
  for(const e of G.enemies){ if(e.dead || e.dist < 0) continue; const dx=e.x-c.x, dy=e.y-c.y;
    if(dx*dx+dy*dy <= r2){ h.atkStart = G.time + tLeft - lead; return; } }
}
function attackFired(h){
  const as = dragonSheet(h.type, h.lvl, 'attack'); if(!as) return;
  const lead = atkLead(as); if(Math.abs(G.time - h.atkStart - lead) > 0.03) h.atkStart = G.time - lead;
}
function supportAnim(h, i){ // Ehecatl has no shot: play its gust strip every few seconds while it buffs a neighbour
  const as = dragonSheet('support', h.lvl, 'attack'); if(!as || G.time - h.atkStart < 2.6 + (h.phase % 1)) return;
  const c = i%COLS, r = (i/COLS)|0;
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){ const cc=c+dc, rr=r+dr;
    if((dr||dc) && cc>=0 && cc<COLS && rr>=0 && rr<ROWS){ const n = G.dragons[rr*COLS+cc]; if(n && n.type!=='support'){ h.atkStart = G.time; return; } } }
}
function step(dt){
  G.time += dt;
  if(G.banner){ G.banner.t -= dt; if(G.banner.t<=0) G.banner=null; }
  if(G.shake>0) G.shake = Math.max(0, G.shake - dt*3);
  // waves
  if(G.wave < TOTAL_WAVES){ G.waveTimer -= dt; if(G.waveTimer <= 0) startWave(G.wave+1); }
  if(G.queue.length){ G.spawnT -= dt; if(G.spawnT <= 0){ const it = G.queue.shift(), k = it.k || it; spawnEnemy(k, it.w);
      G.spawnT = k==='brute' ? B.waves.bruteGap : B.waves.spawnGap; if(G.queue.length && (G.queue[0].k || G.queue[0])==='boss') G.spawnT = B.waves.bossGap; } }
  // enemies
  for(const e of G.enemies){
    if(e.dead) continue;
    let s = e.spd;
    if(e.slowT>0){ e.slowT -= dt; s *= 1 - e.slowF * (e.kind==='boss'?B.bossSlowResist:1); }
    if(e.hitT>0) e.hitT -= dt;
    e.dist += s*dt; posAt(e.dist, e);
    if(e.dist >= pathLen){
      e.dead = true;
      if(e.kind==='boss') G.bossLeaks.push(e.wave); // which boss wave leaked
      if(e.final && B.finalBossLeakLoses){ // H1: final boss reaching the Clutch is a loss, never a win
        G.shake = 1; G.lossReason = 'finalBoss'; G.castle = 0; endGame(false); return; }
      const d = ENEMY[e.kind].dmg;
      G.castle -= d; G.shake = 1; floatText(LW/2, L.castleY-30, '-'+d, '#ff4d6d');
      if(G.castle <= 0){ G.castle = 0; G.lossReason = 'warmth'; endGame(false); return; }
      G.waveLeft[e.wave]--;
    }
  }
  // dragons
  const atkBase = 1 + B.boosts.atkSpd*G.buffs.atkSpd;
  for(let i=0;i<G.dragons.length;i++){
    const h = G.dragons[i]; if(!h) continue;
    if(h.pop>0) h.pop = Math.max(0, h.pop - dt*4);
    if(h.type==='support'){ supportAnim(h, i); continue; }
    if(drag && drag.from===i && drag.moved) continue;
    const H = STATS[h.type], rate = atkBase + supportBonus(i);
    h.cd -= dt * rate;
    if(h.cd > 0){ attackPreroll(h, i, h.cd / rate); continue; }
    const c = cellCenter(i), range = H.range + B.rangePerLevel*(h.lvl-1), r2 = range*range;
    let best = null, bd = -1;
    for(const e of G.enemies){ if(e.dead || e.dist < 0) continue;
      const dx=e.x-c.x, dy=e.y-c.y; if(dx*dx+dy*dy <= r2){
        let score = e.dist; if(h.type==='slow' && e.slowT>0.3) score -= 1e4; // slow tower prefers unslowed targets
        if(score > bd){ bd = score; best = e; } } }
    if(!best){ h.cd = 0.05; continue; }
    h.cd = H.cd; h.aim = Math.atan2(best.y-c.y, best.x-c.x);
    attackFired(h);
    let dmg = H.dmg * dmgMult(h.lvl);
    if(h.type==='fast') dmg *= 1 + B.boosts.fastDmg*G.buffs.fastDmg;
    const crit = rnd() < B.boosts.crit*G.buffs.crit; if(crit) dmg *= 2;
    G.projs.push({type:h.type, lvl:h.lvl, x:c.x, y:c.y, tgt:best, tx:best.x, ty:best.y, spd:H.proj, dmg, crit});
  }
  // projectiles
  for(const p of G.projs){
    if(p.done) continue;
    if(p.tgt && !p.tgt.dead){ p.tx = p.tgt.x; p.ty = p.tgt.y; }
    const dx = p.tx-p.x, dy = p.ty-p.y, d = Math.hypot(dx,dy), mv = p.spd*dt;
    if(d <= mv + 4){
      p.done = true; p.x = p.tx; p.y = p.ty;
      if(p.type==='area'){
        const R = STATS.area.splash * (1 + B.boosts.areaRad*G.buffs.areaRad) * (1 + STATS.area.splashPerLevel*(p.lvl-1)), R2 = R*R;
        for(const e of G.enemies){ if(e.dead) continue; const ex=e.x-p.x, ey=e.y-p.y;
          if(ex*ex+ey*ey <= R2 + e.r*e.r) damage(e, p.dmg, p.crit); }
        if(!sfx('fx.zmei.impact', p.x, p.y, {scale: Math.max(1, Math.round(2*R / 26))})) boom(p.x,p.y,'#ffb36b',R); // explosion art ~26px across at 1x; whole-number scale only
      } else if(p.tgt && !p.tgt.dead){
        damage(p.tgt, p.dmg, p.crit);
        if(p.type==='fast') sfx('fx.jaculus.hit', p.x, p.y);
        if(p.type==='slow'){ const H=STATS.slow;
          p.tgt.slowT = Math.max(p.tgt.slowT, H.slowDur*(1+B.boosts.slowLen*G.buffs.slowLen)*(1+H.slowDurPerLevel*(p.lvl-1)));
          p.tgt.slowF = Math.max(p.tgt.slowF, Math.min(H.slowMax, H.slow + H.slowPerLevel*(p.lvl-1)));
          if(G.sfx.filter(f=>f.under).length < 10) sfx('fx.kanju.pool', p.tgt.x, p.tgt.y + 4, {dur: Math.min(p.tgt.slowT, 2.5), under:true}); }
      }
    } else { p.x += dx/d*mv; p.y += dy/d*mv; }
  }
  // cleanup (in place)
  compact(G.enemies, e=>!e.dead); compact(G.projs, p=>!p.done);
  for(const f of G.fx) f.t += dt; compact(G.fx, f=>f.t<f.d); compact(G.sfx, f=>G.time - f.t0 < f.dur);
  for(const t of G.texts){ t.t += dt; t.y -= 26*dt; } compact(G.texts, t=>t.t<t.d);
  checkCleared();
  // win: wave 20 fully resolved AND the final boss was actually killed (H1)
  if(G.wave===TOTAL_WAVES && !G.queue.length && !G.enemies.length){
    if(G.finalBossKilled || !B.finalBossLeakLoses) endGame(true); else { G.lossReason = 'finalBoss'; endGame(false); } }
}
function compact(a, keep){ let j=0; for(let i=0;i<a.length;i++){ if(keep(a[i])) a[j++]=a[i]; } a.length=j; }

// ---------- Input ----------
let drag = null, pressBtn = null, hoverP = null;
const isPressed = b => !!(pressBtn && b && inR(pressBtn, b));
const SEL_MS = 1500; // range ring display time (ms)
// Client px -> logical px through the displayed box, so fractional scales stay aligned.
function toLogical(cx, cy){ const r = cv.getBoundingClientRect(); return {x:(cx - r.left)*NW/r.width, y:(cy - r.top)*NH/r.height}; }
cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  if(rotateBlock) return;
  tryLockPortrait();
  if(drag || pressBtn) return; // single pointer
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const p = toLogical(e.clientX, e.clientY);
  if(G.mode==='play'){
    const i = cellAt(p.x,p.y);
    if(i>=0 && G.dragons[i]){ drag = {id:e.pointerId, from:i, x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false}; return; }
  }
  pressBtn = {id:e.pointerId, x:p.x, y:p.y};
}, {passive:false});
cv.addEventListener('pointermove', e=>{
  e.preventDefault();
  const p = toLogical(e.clientX, e.clientY); hoverP = e.pointerType==='mouse' ? p : null;
  if(drag && e.pointerId===drag.id){ drag.x=p.x; drag.y=p.y; if(Math.hypot(p.x-drag.sx,p.y-drag.sy) > 6) drag.moved = true; }
  else if(pressBtn && e.pointerId===pressBtn.id){ pressBtn.x = p.x; pressBtn.y = p.y; }
}, {passive:false});
function endPointer(e, cancel){
  if(drag && e.pointerId===drag.id){
    const p = toLogical(e.clientX, e.clientY);
    if(!cancel && drag.moved && G.mode==='play') dropDragon(drag.from, cellAt(p.x,p.y));
    else if(!drag.moved) { G.sel = {i:drag.from, until: performance.now() + SEL_MS}; }
    drag = null; return;
  }
  if(pressBtn && e.pointerId===pressBtn.id){ const p = toLogical(e.clientX, e.clientY); pressBtn = null;
    if(!cancel) tap(p); }
}
cv.addEventListener('pointerup', e=>{ e.preventDefault(); endPointer(e,false); }, {passive:false});
cv.addEventListener('pointercancel', e=>endPointer(e,true));
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu'].forEach(t=>
  document.addEventListener(t, e=>{ if(e.cancelable) e.preventDefault(); }, {passive:false}));
window.addEventListener('keydown', e=>{
  if(rotateBlock) return; // N2: no keyboard control behind the rotate overlay
  if(e.key===' '||e.key==='s') { if(G.mode==='play') summon(); }
  else if(e.key==='e') { if(G.mode==='play') openEnhance(); }
  else if(e.key==='p'||e.key==='Escape') togglePause();
  else if(G.mode==='enhance' && '123'.includes(e.key)) chooseCard(+e.key-1);
});
function togglePause(){ if(G.mode==='play') G.mode='paused'; else if(G.mode==='paused') G.mode='play'; }
function tap(p){
  const m = G.mode;
  if(rotateBlock) return;
  if(m==='menu'){ if(inR(p,UI.play) && ART.ready) newGame('play'); return; }
  if(m==='over'){ if(inR(p,UI.restart)) newGame('play'); return; }
  if(m==='paused'){ if(inR(p,UI.resume) || inR(p,L.btnPause)) G.mode='play'; else if(inR(p,UI.restart)) newGame('play'); return; }
  if(m==='enhance'){ for(let k=0;k<3;k++) if(inR(p,UI.cards[k])) chooseCard(k); return; }
  if(m==='play'){
    if(inR(p,L.btnSummon)) summon();
    else if(inR(p,L.btnEnh)) openEnhance();
    else if(inR(p,L.btnPause)) togglePause();
  }
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && G && G.mode==='play') G.mode='paused'; });

async function loadManifest(url){
  let m;
  try{ const r = await fetch(url, {cache:'no-cache'}); if(!r.ok) throw new Error('HTTP '+r.status); m = await r.json(); }
  catch(e){ ART.errors.push('manifest '+url+': '+e.message); return false; }
  ART.manifests.push(url); addEntries(Array.isArray(m) ? m : (m.sheets || []), url); return true;
}
function addEntries(list, base){
  for(const s of list){ if(!s || !s.id || !s.path) continue;
    ART.pending[s.id] = { id:s.id, key:s.id, src:new URL(s.path, base).href, fw:s.frame_w|0, fh:s.frame_h|0,
      frames:Math.max(1, s.frames|0 || 1), fps:+s.fps || 0, loop: s.loop === undefined ? true : !!s.loop,
      anchor: Array.isArray(s.anchor) ? s.anchor : null, hit: Number.isFinite(s.hit_frame) ? s.hit_frame : null,
      e:s, img:null, ok:false }; }
}
function loadImage(sh){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { sh.img = img;
      if(!sh.fh) sh.fh = img.height; if(!sh.fw) sh.fw = Math.floor(img.width / sh.frames);
      sh.frames = Math.max(1, Math.min(sh.frames, Math.floor(img.width / sh.fw)));
      if(!sh.anchor) sh.anchor = sh.e.category==='tile' ? [0,0] : [sh.fw>>1, sh.fh-1];
      sh.ok = true; res(); };
    img.onerror = () => { ART.errors.push('image '+sh.src); res(); };
    img.src = sh.src;
  });
}
function indexArt(){
  ART.dragon = {}; ART.enemy = {}; ART.clutch = {}; ART.card = {};
  for(const sh of Object.values(ART.sheets)){ const e = sh.e, cat = e.category || '';
    let m;
    if(cat==='dragon' || (m = /^([a-z]+)_lv(\d)_([a-z]+)$/.exec(sh.id))){
      const d = e.dragon || (m && m[1]), lv = +(e.level || (m && m[2])), an = e.anim || (m && m[3]);
      if(d && lv && an) ART.dragon[d+'|'+lv+'|'+an] = sh; }
    else if(cat==='enemy'){ const en = e.enemy || sh.id.split('_')[0]; ART.enemy[en+'|'+(e.anim || 'walk')] = sh; }
    else if(cat==='enhance_card' && e.enhancement){ ART.card[e.enhancement] = sh; }
    else if(cat==='clutch'){ ART.clutch[e.state || sh.id.replace(/^clutch_/,'')] = sh; }
  }
}
async function loadArt(){
  const fontP = (document.fonts && document.fonts.load) ? document.fonts.load('8px "Press Start 2P"').catch(()=>{}) : Promise.resolve();
  const url = new URL(CONFIG.art.manifest, location.href).href;

  else await loadManifest(url);

  for(const k of Object.keys(ART.pending)) if(ART.pending[k].ok) ART.sheets[k] = ART.pending[k];

// Semantic slot -> first Designer id present (CONFIG.art.slots). Unlisted slots are looked up by id directly.
function sheet(slot){
  if(ART.cache.has(slot)) return ART.cache.get(slot);
  const ids = CONFIG.art.slots[slot] || [slot]; let found = null;
  for(const id of ids){ if(ART.sheets[id]){ found = ART.sheets[id]; break; } }
  if(!found && slot.startsWith('fx.')){ // structured match for batch 2: category fx/effect/projectile + dragon field
    const [, d, kind] = slot.split('.');
    for(const sh of Object.values(ART.sheets)){ const e = sh.e;
      if(/proj|fx|effect/.test(e.category||'') && e.dragon===d && (kind==='impact') === /impact|hit|burst|explo/.test((e.anim||'')+' '+sh.id)){ found = sh; break; } } }
  ART.cache.set(slot, found); return found;
}
// Dragon: exact level -> nearest level (ties prefer lower). 'attack' never falls back to idle (no attack art = no attack anim).
function dragonSheet(type, lvl, anim){
  const ck = 'd'+type+lvl+anim; if(ART.cache.has(ck)) return ART.cache.get(ck);
  const id = CONFIG.art.towers[type]; let found = null;
  for(const l of [1,2,3,4,5].sort((a,b)=> Math.abs(a-lvl)-Math.abs(b-lvl) || a-b)){ const s = ART.dragon[id+'|'+l+'|'+anim]; if(s){ found = s; break; } }
  ART.cache.set(ck, found); return found;
}
// Enemy: walk (or move/idle) -> final boss falls back to the regular boss art -> null (placeholder)
function enemySheet(e){
  const ck = 'e'+e.kind+(e.final?'F':''); if(ART.cache.has(ck)) return ART.cache.get(ck);
  const ids = e.final ? [CONFIG.art.finalBoss, CONFIG.art.enemies.boss] : [CONFIG.art.enemies[e.kind]];
  let found = null;
  for(const id of ids){ for(const a of ['walk','move','idle']){ const s = ART.enemy[id+'|'+a]; if(s){ found = s; break; } } if(found) break; }
  ART.cache.set(ck, found); return found;
}
// Clutch: full / mid / low by warmth; a missing state uses the nearest one that exists.
function clutchSheet(frac){
  const t = CONFIG.art.clutchStates, want = frac > t.full ? 0 : frac > t.mid ? 1 : 2, order = ['full','mid','low'];
  for(const d of [0,1,-1,2,-2]){ const s = ART.clutch[order[want+d]]; if(s) return s; }

}

// ---------- Orientation (rotate overlay, DOM so it stays readable at any canvas size) ----------
function isPhoneLandscape(){
  // N1: only phone-like devices: coarse pointer AND no hover, a small physical SCREEN, and a landscape window.
  const phoneLike = !!(window.matchMedia && matchMedia('(pointer: coarse) and (hover: none)').matches);
  const shortSide = Math.min(screen.width || 9999, screen.height || 9999);
  return phoneLike && shortSide < CONFIG.display.rotateOverlayMaxScreenShortSide && vw > vh;
}
let rotateBlock = false;
function updateOrientation(){
  rotateBlock = isPhoneLandscape();
  rotEl.style.display = rotateBlock ? 'flex' : 'none';
  cv.style.visibility = rotateBlock ? 'hidden' : 'visible';
  if(rotateBlock){ if(G && G.mode==='play') G.mode = 'paused'; drag = null; pressBtn = null; }
}
function tryLockPortrait(){ try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(()=>{}); }catch(_){} }
const fmtTime = t => Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');

// ---------- Loop ----------
let last = performance.now(), acc = 0, fpsShown = 60, fpsN = 0, fpsT = 0;
const frameTimes = [], workTimes = [];
const FIXED = 1/120;
function frame(now){
  const t0 = performance.now();
  let dt = Math.min(0.1, (now - last)/1000); last = now;
  frameTimes.push(dt*1000); if(frameTimes.length>600) frameTimes.shift();
  fpsN++; fpsT += dt; if(fpsT>=0.5){ fpsShown = Math.round(fpsN/fpsT); fpsN=0; fpsT=0; }
  if(G.mode==='play'){
    acc += dt*SPEED; let n=0;
    while(acc >= FIXED && n < 2000){ step(FIXED); acc -= FIXED; n++; if(G.mode!=='play') { acc=0; break; } }
  } else acc = 0;
  if(!rotateBlock) draw(now);
  workTimes.push(performance.now()-t0); if(workTimes.length>600) workTimes.shift();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', ()=>{ resize(); updateOrientation(); });
window.addEventListener('orientationchange', ()=>setTimeout(()=>{ resize(); updateOrientation(); },200));
document.getElementById('rotT').textContent = T('rotate').toUpperCase(); document.getElementById('rotS').textContent = T('rotateSub');
layout(); resize(); newGame('menu'); updateOrientation(); buildBackground(); loadArt();
requestAnimationFrame(t=>{ last=t; frame(t); });

// ---------- Test/debug hook (read-only helpers) ----------
window.__evo = {
  get G(){ return G; }, get save(){ return save; }, seed: SEED, speed: SPEED,
  frameTimes, workTimes,
  // CSS-pixel client coords of a logical point / cell / button, for automated tests

  sheetId: slot => { const s = sheet(slot); return s ? s.id : null; }, clutchId: f => { const s = clutchSheet(f); return s ? s.id : null; },
  enemySheetId: (kind, final) => { const s = enemySheet({kind, final}); return s ? s.id : null; },

  dropArt: () => { ART.dragon = {}; ART.cache.clear(); },

  cell(i){ const c = cellCenter(i); return this.toClient(c.x,c.y); },

};
